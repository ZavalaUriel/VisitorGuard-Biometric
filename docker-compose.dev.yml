# Configuración para desarrollo local
# Solo levanta MongoDB, el backend se ejecuta fuera de Docker

services:
  mongodb:
    image: mongo:7.0
    container_name: visitorguard-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: visitorguard2025
      MONGO_INITDB_DATABASE: visitorguard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
      - mongodb_config_dev:/data/configdb
    networks:
      - visitorguard-network

  # Mongo Express - Interfaz Web para MongoDB
  mongo-express:
    image: mongo-express:latest
    container_name: visitorguard-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: visitorguard2025
      ME_CONFIG_MONGODB_URL: mongodb://admin:visitorguard2025@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - visitorguard-network

volumes:
  mongodb_data_dev:
    driver: local
  mongodb_config_dev:
    driver: local

networks:
  visitorguard-network:
    driver: bridge
