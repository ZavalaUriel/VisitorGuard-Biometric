<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisitorGuard - Escáner Facial AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Partículas de fondo animadas */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-20px) translateX(10px); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.4);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3c72 0%, #7e22ce 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
            font-weight: 400;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(126, 34, 206, 0.3);
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* Efecto espejo */
        }

        #canvas {
            display: none;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Sistema de detección AI */
        .ai-detection {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 350px;
            border: 3px solid #00ff88;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5),
                        inset 0 0 30px rgba(0, 255, 136, 0.2);
            animation: aiPulse 2s infinite;
        }

        @keyframes aiPulse {
            0%, 100% {
                border-color: #00ff88;
                box-shadow: 0 0 30px rgba(0, 255, 136, 0.5),
                            inset 0 0 30px rgba(0, 255, 136, 0.2);
            }
            50% {
                border-color: #00d4ff;
                box-shadow: 0 0 50px rgba(0, 212, 255, 0.7),
                            inset 0 0 50px rgba(0, 212, 255, 0.3);
            }
        }

        /* Líneas de escaneo múltiples */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #00ff88 50%, 
                transparent 100%);
            box-shadow: 0 0 15px #00ff88;
            animation: scanVertical 3s linear infinite;
        }

        .scan-line:nth-child(2) {
            animation-delay: 1s;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #00d4ff 50%, 
                transparent 100%);
            box-shadow: 0 0 15px #00d4ff;
        }

        @keyframes scanVertical {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }

        /* Esquinas tecnológicas */
        .corner {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 4px solid #00ff88;
            transition: all 0.3s;
        }

        .corner.top-left {
            top: 12%;
            left: 22%;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 10px;
        }

        .corner.top-right {
            top: 12%;
            right: 22%;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 10px;
        }

        .corner.bottom-left {
            bottom: 12%;
            left: 22%;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 10px;
        }

        .corner.bottom-right {
            bottom: 12%;
            right: 22%;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 10px;
        }

        /* Grid de análisis */
        .analysis-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, rgba(0, 255, 136, 0.1) 0px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, rgba(0, 255, 136, 0.1) 0px, transparent 1px, transparent 40px);
            opacity: 0.3;
        }

        /* Indicador de estado */
        .status-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: #00ff88;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: dotPulse 1.5s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Contador de personas detectadas */
        .detection-counter {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 15px;
            color: #fff;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Resultado del escaneo */
        .result-panel {
            margin-top: 30px;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-panel.success {
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            color: #fff;
        }

        .result-panel.error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: #fff;
        }

        .result-panel.waiting {
            background: linear-gradient(135deg, #ffd93d 0%, #ff9a3d 100%);
            color: #333;
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .result-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-message {
            font-size: 1.1rem;
            margin-bottom: 10px;
            opacity: 0.95;
        }

        .result-details {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Loading spinner moderno */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 4px solid rgba(126, 34, 206, 0.1);
            border-top: 4px solid #7e22ce;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #1e3c72;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Countdown timer */
        .countdown {
            font-size: 3rem;
            font-weight: 700;
            color: #7e22ce;
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .ai-detection {
                width: 220px;
                height: 280px;
            }
        }

        /* Estado de captura */
        .capturing {
            animation: flash 0.2s;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <h1>🔐 VisitorGuard AI</h1>
            <p class="subtitle">Sistema de Reconocimiento Facial Avanzado</p>
        </div>

        <div class="camera-container" id="cameraContainer">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            
            <div class="scanner-overlay">
                <div class="analysis-grid"></div>
                <div class="ai-detection"></div>
                <div class="scan-line"></div>
                <div class="scan-line"></div>
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="status-indicator" id="statusIndicator">
                    <div class="status-dot"></div>
                    <span id="statusText">Inicializando sistema...</span>
                </div>
                <div class="detection-counter" id="detectionCounter">
                    Detecciones: <span id="detectCount">0</span>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Analizando biometría facial...</div>
        </div>

        <div class="result-panel" id="resultPanel">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-message" id="resultMessage"></div>
            <div class="result-details" id="resultDetails"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const loading = document.getElementById('loading');
        const resultPanel = document.getElementById('resultPanel');
        const detectCount = document.getElementById('detectCount');
        const cameraContainer = document.getElementById('cameraContainer');

        let detectionAttempts = 0;
        let isProcessing = false;
        let faceDetectionModel = null;

        // API Configuration
        const API_URL = 'http://localhost:5000/api/face-recognition/verify';

        // Inicializar partículas de fondo
        function initParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 5 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Inicializar cámara
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                });
                video.srcObject = stream;
                
                video.addEventListener('loadedmetadata', () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    updateStatus('Sistema activo - Esperando rostro...', '#00ff88');
                    startFaceDetection();
                });
            } catch (error) {
                console.error('Error al acceder a la cámara:', error);
                updateStatus('Error: No se puede acceder a la cámara', '#ff6b6b');
            }
        }

        // Actualizar estado
        function updateStatus(message, color = '#00ff88') {
            statusText.textContent = message;
            statusIndicator.style.borderColor = color;
            statusIndicator.style.color = color;
            const dot = statusIndicator.querySelector('.status-dot');
            if (dot) dot.style.background = color;
        }

        // Detectar rostro usando análisis de imagen simple
        async function detectFace() {
            if (isProcessing) return false;

            // Capturar frame actual
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // Análisis simple: verificar si hay suficiente contraste (indicador de rostro)
            // En producción, usar un modelo ML como face-api.js o TensorFlow.js
            const brightness = calculateBrightness(imageData);
            const contrast = calculateContrast(imageData);
            
            // Si hay suficiente contraste y brillo, asumimos que hay un rostro
            return brightness > 50 && contrast > 30;
        }

        // Calcular brillo promedio
        function calculateBrightness(imageData) {
            const data = imageData.data;
            let sum = 0;
            for (let i = 0; i < data.length; i += 4) {
                sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
            }
            return sum / (data.length / 4);
        }

        // Calcular contraste
        function calculateContrast(imageData) {
            const data = imageData.data;
            let min = 255, max = 0;
            for (let i = 0; i < data.length; i += 4) {
                const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                if (avg < min) min = avg;
                if (avg > max) max = avg;
            }
            return max - min;
        }

        // Sistema de detección continua
        async function startFaceDetection() {
            setInterval(async () => {
                if (!isProcessing) {
                    const faceDetected = await detectFace();
                    
                    if (faceDetected) {
                        updateStatus('¡Rostro detectado! Capturando...', '#00d4ff');
                        captureAndVerify();
                    }
                }
            }, 1000); // Verificar cada segundo
        }

        // Capturar y verificar rostro
        async function captureAndVerify() {
            if (isProcessing) return;
            
            isProcessing = true;
            detectionAttempts++;
            detectCount.textContent = detectionAttempts;

            // Efecto de captura
            cameraContainer.classList.add('capturing');
            setTimeout(() => cameraContainer.classList.remove('capturing'), 200);

            // Capturar imagen
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Mostrar loading
            loading.classList.add('active');
            resultPanel.style.display = 'none';
            updateStatus('Analizando biometría...', '#ffd93d');

            // Convertir a blob
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    loading.classList.remove('active');

                    if (result.match) {
                        showResult('success', '✅', 'Acceso Autorizado', 
                            `Bienvenido, ${result.nombre}`,
                            `ID: ${result.id_persona} | Similitud: ${(result.similarity * 100).toFixed(1)}%`);
                        updateStatus('Verificación exitosa', '#00ff88');
                    } else {
                        showResult('error', '❌', 'Acceso Denegado', 
                            'Persona no reconocida',
                            'No se encontró coincidencia en la base de datos');
                        updateStatus('Sin coincidencias - Reintentando...', '#ff6b6b');
                    }

                    // Reintentar después de 5 segundos
                    setTimeout(() => {
                        resultPanel.style.display = 'none';
                        updateStatus('Sistema activo - Esperando rostro...', '#00ff88');
                        isProcessing = false;
                    }, 5000);

                } catch (error) {
                    console.error('Error:', error);
                    loading.classList.remove('active');
                    showResult('error', '⚠️', 'Error de Conexión', 
                        'No se pudo conectar con el servidor',
                        'Verifique la conexión y vuelva a intentar');
                    updateStatus('Error de conexión', '#ff6b6b');
                    
                    // Reintentar después de 5 segundos
                    setTimeout(() => {
                        resultPanel.style.display = 'none';
                        updateStatus('Sistema activo - Esperando rostro...', '#00ff88');
                        isProcessing = false;
                    }, 5000);
                }
            }, 'image/jpeg', 0.95);
        }

        // Mostrar resultado
        function showResult(type, icon, title, message, details) {
            resultPanel.className = 'result-panel ' + type;
            document.getElementById('resultIcon').textContent = icon;
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('resultDetails').textContent = details;
            resultPanel.style.display = 'block';
        }

        // Inicializar todo
        window.addEventListener('DOMContentLoaded', () => {
            initParticles();
            initCamera();
        });
    </script>
</body>
</html>
