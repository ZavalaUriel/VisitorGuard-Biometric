<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisitorGuard - Escáner Facial AI</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Partículas de fondo animadas */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-20px) translateX(10px); }
        }

        .container {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(100, 100, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #aaa;
            font-size: 1rem;
            font-weight: 400;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(126, 34, 206, 0.3);
        }

        #video {
            width: 100%;
            height: auto;
            display: block;
            transform: scaleX(-1); /* Efecto espejo */
        }

        #canvas {
            display: none;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Sistema de detección AI */
        .ai-detection {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 350px;
            border: 3px solid #00ff88;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5),
                        inset 0 0 30px rgba(0, 255, 136, 0.2);
            animation: aiPulse 2s infinite;
        }

        @keyframes aiPulse {
            0%, 100% {
                border-color: #00ff88;
                box-shadow: 0 0 30px rgba(0, 255, 136, 0.5),
                            inset 0 0 30px rgba(0, 255, 136, 0.2);
            }
            50% {
                border-color: #00d4ff;
                box-shadow: 0 0 50px rgba(0, 212, 255, 0.7),
                            inset 0 0 50px rgba(0, 212, 255, 0.3);
            }
        }

        /* Líneas de escaneo múltiples */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #00ff88 50%, 
                transparent 100%);
            box-shadow: 0 0 15px #00ff88;
            animation: scanVertical 3s linear infinite;
        }

        .scan-line:nth-child(2) {
            animation-delay: 1s;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #00d4ff 50%, 
                transparent 100%);
            box-shadow: 0 0 15px #00d4ff;
        }

        @keyframes scanVertical {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }

        /* Esquinas tecnológicas */
        .corner {
            position: absolute;
            width: 50px;
            height: 50px;
            border: 4px solid #00ff88;
            transition: all 0.3s;
        }

        .corner.top-left {
            top: 12%;
            left: 22%;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 10px;
        }

        .corner.top-right {
            top: 12%;
            right: 22%;
            border-left: none;
            border-bottom: none;
            border-top-right-radius: 10px;
        }

        .corner.bottom-left {
            bottom: 12%;
            left: 22%;
            border-right: none;
            border-top: none;
            border-bottom-left-radius: 10px;
        }

        .corner.bottom-right {
            bottom: 12%;
            right: 22%;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 10px;
        }

        /* Grid de análisis */
        .analysis-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, rgba(0, 255, 136, 0.1) 0px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, rgba(0, 255, 136, 0.1) 0px, transparent 1px, transparent 40px);
            opacity: 0.3;
        }

        /* Indicador de estado */
        .status-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: #00ff88;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: dotPulse 1.5s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Contador de personas detectadas */
        .detection-counter {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 15px;
            color: #fff;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Notificaciones estilo toast */
        .result-panel {
            position: fixed;
            top: 20px;
            right: -400px;
            max-width: 380px;
            padding: 20px 25px;
            border-radius: 15px;
            text-align: left;
            display: none;
            animation: slideInRight 0.5s ease-out forwards;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 9999;
            border-left: 5px solid;
        }

        @keyframes slideInRight {
            from {
                right: -400px;
                opacity: 0;
            }
            to {
                right: 20px;
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                right: 20px;
                opacity: 1;
            }
            to {
                right: -400px;
                opacity: 0;
            }
        }

        .result-panel.hiding {
            animation: slideOutRight 0.5s ease-out forwards;
        }

        .result-panel.success {
            background: rgba(0, 255, 136, 0.15);
            backdrop-filter: blur(10px);
            border-left-color: #00ff88;
            color: #00ff88;
        }

        .result-panel.error {
            background: rgba(255, 107, 107, 0.15);
            backdrop-filter: blur(10px);
            border-left-color: #ff6b6b;
            color: #ff6b6b;
        }

        .result-panel.waiting {
            background: rgba(255, 217, 61, 0.15);
            backdrop-filter: blur(10px);
            border-left-color: #ffd93d;
            color: #ffd93d;
        }

        .result-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            display: inline-block;
            margin-right: 10px;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: inline-block;
        }

        .result-message {
            font-size: 0.95rem;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .result-details {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* Loading spinner moderno */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 4px solid rgba(126, 34, 206, 0.1);
            border-top: 4px solid #7e22ce;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00ff88;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Countdown timer */
        .countdown {
            font-size: 3rem;
            font-weight: 700;
            color: #7e22ce;
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .ai-detection {
                width: 220px;
                height: 280px;
            }
        }

        /* Estado de captura */
        .capturing {
            animation: flash 0.2s;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="header">
            <h1>🔐 VisitorGuard AI</h1>
            <p class="subtitle">Sistema de Reconocimiento Facial Avanzado</p>
        </div>

        <div class="camera-container" id="cameraContainer">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            
            <div class="scanner-overlay">
                <div class="analysis-grid"></div>
                <div class="ai-detection"></div>
                <div class="scan-line"></div>
                <div class="scan-line"></div>
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="status-indicator" id="statusIndicator">
                    <div class="status-dot"></div>
                    <span id="statusText">Inicializando sistema...</span>
                </div>
                <div class="detection-counter" id="detectionCounter">
                    Detecciones: <span id="detectCount">0</span>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Analizando biometría facial...</div>
        </div>

        <div class="result-panel" id="resultPanel">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-message" id="resultMessage"></div>
            <div class="result-details" id="resultDetails"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const statusIndicator = document.getElementById('statusIndicator');
        const loading = document.getElementById('loading');
        const resultPanel = document.getElementById('resultPanel');
        const detectCount = document.getElementById('detectCount');
        const cameraContainer = document.getElementById('cameraContainer');

        let detectionAttempts = 0;
        let isProcessing = false;
        let modelsLoaded = false;
        let faceDetectionInterval = null;
        let lastDetectionTime = 0;
        let stableFaceCounter = 0;
        const REQUIRED_STABLE_FRAMES = 8; // Frames estables requeridos antes de capturar
        const MIN_DETECTION_INTERVAL = 3000; // Mínimo 3 segundos entre capturas

        // API Configuration
        const API_URL = 'http://localhost:5000/api/face-recognition/verify';

        // Inicializar partículas de fondo
        function initParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 5 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Cargar modelos de face-api.js
        async function loadFaceAPIModels() {
            try {
                updateStatus('Cargando modelos de IA...', '#ffd93d');
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
                
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                
                modelsLoaded = true;
                console.log('✅ Modelos de detección facial cargados');
                return true;
            } catch (error) {
                console.error('❌ Error cargando modelos:', error);
                modelsLoaded = false;
                return false;
            }
        }

        // Inicializar cámara
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }
                });
                video.srcObject = stream;
                
                video.addEventListener('loadedmetadata', async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    // Cargar modelos de detección
                    const loaded = await loadFaceAPIModels();
                    
                    if (loaded) {
                        updateStatus('Sistema activo - Coloque su rostro en el centro', '#00ff88');
                        startFaceDetection();
                    } else {
                        updateStatus('Error cargando modelos de IA', '#ff6b6b');
                    }
                });
            } catch (error) {
                console.error('Error al acceder a la cámara:', error);
                updateStatus('Error: No se puede acceder a la cámara', '#ff6b6b');
            }
        }

        // Actualizar estado
        function updateStatus(message, color = '#00ff88') {
            statusText.textContent = message;
            statusIndicator.style.borderColor = color;
            statusIndicator.style.color = color;
            const dot = statusIndicator.querySelector('.status-dot');
            if (dot) dot.style.background = color;
        }

        // Detectar rostro usando face-api.js (detección REAL y precisa)
        async function detectFaceWithAI() {
            if (!modelsLoaded || isProcessing) return null;

            try {
                const options = new faceapi.TinyFaceDetectorOptions({
                    inputSize: 416,
                    scoreThreshold: 0.5
                });

                const detections = await faceapi
                    .detectAllFaces(video, options)
                    .withFaceLandmarks();

                return detections;
            } catch (error) {
                console.error('Error en detección:', error);
                return null;
            }
        }

        // Verificar si el rostro está bien posicionado y estable
        function isFaceWellPositioned(detection) {
            if (!detection) return false;

            const box = detection.detection.box;
            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;

            // Calcular posición del centro del rostro
            const faceCenterX = box.x + box.width / 2;
            const faceCenterY = box.y + box.height / 2;
            
            // Centro del video
            const videoCenterX = videoWidth / 2;
            const videoCenterY = videoHeight / 2;

            // Calcular desviación del centro
            const deviationX = Math.abs(faceCenterX - videoCenterX);
            const deviationY = Math.abs(faceCenterY - videoCenterY);

            // Tolerancia: 25% del ancho/alto del video
            const toleranceX = videoWidth * 0.25;
            const toleranceY = videoHeight * 0.25;

            // Verificar tamaño del rostro (ni muy cerca ni muy lejos)
            const minSize = Math.min(videoWidth, videoHeight) * 0.25;
            const maxSize = Math.min(videoWidth, videoHeight) * 0.6;
            const faceSize = Math.max(box.width, box.height);

            const isInCenter = deviationX < toleranceX && deviationY < toleranceY;
            const isGoodSize = faceSize >= minSize && faceSize <= maxSize;
            const hasGoodScore = detection.detection.score > 0.7;

            return isInCenter && isGoodSize && hasGoodScore;
        }

        // Sistema de detección continua mejorado
        async function startFaceDetection() {
            let consecutiveDetections = 0;
            let lastGoodDetection = null;

            faceDetectionInterval = setInterval(async () => {
                if (isProcessing) return;

                const detections = await detectFaceWithAI();

                if (detections && detections.length > 0) {
                    const mainDetection = detections[0]; // Usar el primer rostro detectado
                    const isWellPositioned = isFaceWellPositioned(mainDetection);

                    if (isWellPositioned) {
                        consecutiveDetections++;
                        lastGoodDetection = mainDetection;
                        
                        // Feedback visual progresivo
                        if (consecutiveDetections < REQUIRED_STABLE_FRAMES) {
                            const progress = Math.round((consecutiveDetections / REQUIRED_STABLE_FRAMES) * 100);
                            updateStatus(`Rostro detectado - Manténgase quieto (${progress}%)`, '#00d4ff');
                        } else {
                            // Verificar intervalo mínimo entre capturas
                            const now = Date.now();
                            if (now - lastDetectionTime >= MIN_DETECTION_INTERVAL) {
                                updateStatus('¡Capturando!', '#00ff88');
                                captureAndVerify();
                                consecutiveDetections = 0;
                            }
                        }
                    } else {
                        // Rostro detectado pero no bien posicionado
                        consecutiveDetections = Math.max(0, consecutiveDetections - 2);
                        
                        const box = mainDetection.detection.box;
                        const faceCenterX = box.x + box.width / 2;
                        const videoCenterX = video.videoWidth / 2;
                        
                        if (Math.abs(faceCenterX - videoCenterX) > video.videoWidth * 0.25) {
                            updateStatus('Centre su rostro en la pantalla', '#ffd93d');
                        } else if (box.width < video.videoWidth * 0.25) {
                            updateStatus('Acérquese un poco más', '#ffd93d');
                        } else if (box.width > video.videoWidth * 0.6) {
                            updateStatus('Aléjese un poco', '#ffd93d');
                        } else {
                            updateStatus('Ajuste su posición', '#ffd93d');
                        }
                    }
                } else {
                    // No se detectó rostro
                    consecutiveDetections = Math.max(0, consecutiveDetections - 3);
                    updateStatus('Esperando rostro - Mire a la cámara', '#00ff88');
                }
            }, 200); // Verificar cada 200ms
        }

        // Capturar y verificar rostro
        async function captureAndVerify() {
            if (isProcessing) return;
            
            isProcessing = true;
            detectionAttempts++;
            detectCount.textContent = detectionAttempts;
            lastDetectionTime = Date.now();

            // Efecto de captura
            cameraContainer.classList.add('capturing');
            setTimeout(() => cameraContainer.classList.remove('capturing'), 200);

            // Capturar imagen
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Mostrar loading
            loading.classList.add('active');
            resultPanel.style.display = 'none';
            updateStatus('Analizando biometría...', '#ffd93d');

            // Convertir a blob
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('image', blob, 'capture.jpg');

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    loading.classList.remove('active');

                    // Verificar si hay error de detección facial
                    if (result.error && result.error.includes('No face detected')) {
                        showResult('waiting', '⚠️', 'Rostro no detectado', 
                            'No se pudo detectar su rostro claramente',
                            'Por favor asegúrese de estar bien iluminado y de frente');
                        updateStatus('Esperando rostro - Mejore la iluminación', '#ffd93d');
                    } else if (result.match) {
                        showResult('success', '✅', 'Acceso Autorizado', 
                            `Bienvenido, ${result.nombre}`,
                            `Verificación exitosa`);
                        updateStatus('Verificación exitosa', '#00ff88');
                    } else {
                        showResult('error', '❌', 'Acceso Denegado', 
                            'Persona no reconocida',
                            'No se encontró coincidencia en la base de datos');
                        updateStatus('Sin coincidencias - Reintentando...', '#ff6b6b');
                    }

                    // Reintentar después de 3 segundos (reducido para mejor experiencia)
                    setTimeout(() => {
                        updateStatus('Coloque su rostro en el centro', '#00ff88');
                        isProcessing = false;
                    }, 3000);

                } catch (error) {
                    console.error('Error:', error);
                    loading.classList.remove('active');
                    showResult('error', '⚠️', 'Error de Conexión', 
                        'No se pudo conectar con el servidor',
                        'Verifique la conexión y vuelva a intentar');
                    updateStatus('Error de conexión', '#ff6b6b');
                    
                    // Reintentar después de 3 segundos
                    setTimeout(() => {
                        resultPanel.style.display = 'none';
                        updateStatus('Coloque su rostro en el centro', '#00ff88');
                        isProcessing = false;
                    }, 3000);
                }
            }, 'image/jpeg', 0.95);
        }

        // Mostrar resultado como notificación
        function showResult(type, icon, title, message, details) {
            // Ocultar notificación anterior si existe
            if (resultPanel.classList.contains('hiding')) {
                resultPanel.classList.remove('hiding');
            }
            
            resultPanel.className = 'result-panel ' + type;
            document.getElementById('resultIcon').textContent = icon;
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('resultDetails').textContent = details;
            resultPanel.style.display = 'block';
            
            // Auto-ocultar después de 3 segundos
            setTimeout(() => {
                resultPanel.classList.add('hiding');
                setTimeout(() => {
                    resultPanel.style.display = 'none';
                    resultPanel.classList.remove('hiding');
                }, 500);
            }, 3000);
        }

        // Inicializar todo
        window.addEventListener('DOMContentLoaded', () => {
            initParticles();
            initCamera();
        });
    </script>
</body>
</html>
