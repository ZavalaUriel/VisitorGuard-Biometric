services:
  mongodb:
    image: mongo:7.0
    container_name: visitorguard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: visitorguard2025
      MONGO_INITDB_DATABASE: visitorguard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - visitorguard-network

  mongo-express:
    image: mongo-express:latest
    container_name: visitorguard-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: visitorguard2025
      ME_CONFIG_MONGODB_URL: mongodb://admin:visitorguard2025@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - visitorguard-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visitorguard-backend
    restart: unless-stopped
    environment:
      - MONGODB_URL=mongodb://admin:visitorguard2025@mongodb:27017/visitorguard?authSource=admin
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/temp:/app/temp
    depends_on:
      - mongodb
    networks:
      - visitorguard-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  visitorguard-network:
    driver: bridge
